<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Record</title>
  <link rel="index stylesheet" href="ItemRecord.css">
</head>
<body>

  <h1>Item Record</h1>

  <form>

    <div>
      <label for="Item ID">Item ID</label>
      <input type="text" id="Item ID" name ="Item ID">
    </div>

      <br>

    <div>
      <label  for="Item Description">Item Description</label>
      <input  type="text" id="Item Description" name ="Item Description">
    </div>

    <br>

    <div>
      <label for="Serial Number">Serial Number</label>
      <input type="text" id="Serial Number" name ="Serial Number">
    </div>
    
    <br>

    <div>
      <label for="Model Number">Model Number</label>
      <input type="text" id="Model Number" name ="Model Number">
    </div>

    <br>

    <div>
      <label for="Manufacturer">Manufacturer</label>
      <input type="text" id="Manufacturer" name ="Manufacturer">
    </div>

    <br>

    <div>
      <label for="Item Type">Item Type</label>
      <input type="text" id="Item Type" name ="Item Type">
    </div>

    <br>

    <div>
      <label for="Calibration Completed">Calibration Completed</label>
      <input type="text" id="Calibration Completed" name ="Calibration Completed">
    </div>

    <br>

    <div>
      <label for="Calibration Due">Calibration Due</label>
      <input type="text" id="Calibration Due" name ="Calibration Due">
    </div>

    <br>

    <div>
      <label for="Location">Location</label>
      <input type="text" id="Location" name ="Location">
    </div>

    <br>

    <div>
      <label for="Item History">Item History</label>
      <input type="text" id="Item History" name ="Item History">
    </div>


  </form>


</body>
</html>
