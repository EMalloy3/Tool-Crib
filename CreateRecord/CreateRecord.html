<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Record</title>
  <link rel="CreateRecord stylesheet" href="CreateRecord.css">
</head>
<body>
  
<h1 class="container" style="font-size:50px;">Create Record</h1>

<div class="container">
      <label for="Tool ID">Tool ID</label>
      <input style="font-size:30px; border-radius:25px;" type="text" id="Tool ID" name ="Tool ID">
</div>

      <br>

<div class="container">
      <label for="Description">Description</label>
      <input style="font-size:30px; border-radius:25px;" type="text" id="Description" name ="Description">
    </div>

      <br>      

<div class="container">
      <label for="Model Number">Model Number</label>
      <input style="font-size:30px; border-radius:25px;" type="text" id="Model Number" name ="Model Number">
    </div>

      <br>

<div class="container">
      <label for="Serial Number">Serial Number</label>
      <input style="font-size:30px; border-radius:25px;" type="text" id="Serial Number" name ="Serial Number">
    </div>

      <br>

<div class="container">
      <label for="Type">Type</label>
      <input style="font-size:30px; border-radius:25px;" type="text" id="Type" name ="Type">
    </div>

      <br>

<div class="container">
      <label for="Location">Location</label>
      <input style="font-size:30px; border-radius:25px;" type="text" id="Location" name ="Location">
    </div>

      <br>      

<div class="container">
      <label for="Calibration Date">Calibration Date</label>
      <input style="font-size:30px; border-radius:25px;" type="text" id="Calibration Date" name ="Calibration Date">
    </div>

      <br>

<div class="container">
      <label for="Calibration Due">Calibration Due</label>
      <input style="font-size:30px; border-radius:25px;" type="text" id="Calibration Due" name ="Calibration Due">
    </div>

      <br>

<div class="container">
  <button style="font-size:30px; border-radius:25px;">Create</button>
  </div>      

</body>
</html>
