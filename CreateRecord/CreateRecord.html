<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Record</title>

  <!-- Links the external CSS file for styling -->
  <link rel="stylesheet" href="CreateRecord.css">
</head>

<body>

  <!-- Header section containing the company name and page title -->
  <header>
    <h1 class="company">Tool Crib</h1> <h1 class="container" style="font-size:30px">Create Record</h1>
    
    <!-- Navigation menu linking to other pages -->
      <nav class="navbar">
        <ul>
          <li><a href="MainMenu.html">Main Menu</a></li>
          <li><a href="EmployeeRecord.html">Employee Record</a></li>
          <li><a href="Search.html">Search</a></li>
        </ul>
    </nav>
  </header>
  <br>

    <main>
      <form id="createRecordForm">
        <div class="container">
          <label for="Tool_ID">Tool ID</label>
          <input type="text" id="Tool_ID" required>
        </div>
        <br>

        <div class="container">
          <label for="Description">Description</label>
          <input type="text" id="Description" required>
        </div>

        <br>      

        <div class="container">
          <label for="Model_Number">Model Number</label>
          <input type="text" id="Model_Number" required>
        </div>

        <br>

        <div class="container">
          <label for="Serial_Number">Serial Number</label>
          <input type="text" id="Serial_Number" required>
        </div>

        <br>

        <div class="container">
          <label for="Type">Manufacturer</label>
          <input type="text" id="Manufacturer" required>
        </div>

        <br>
        
        <div class="container">
          <label for="Type">Type</label>
          <input type="text" id="Type" required>
        </div>

        <br>

        <div class="container">
          <label for="Location">Location</label>
          <input type="text" id="Location" required>
        </div>

        <br>      

        <div class="container">
          <label for="Calibration_Date">Calibration Date</label>
          <input type="text" id="Calibration_Date" required>
        </div>

        <br>

        <div class="container">
          <label for="Calibration_Due">Calibration Due</label>
          <input type="text" id="Calibration_Due" required>
        </div>

        <br>

        <!-- Submit button used to create the tool record -->
        <div class="container">
          <button type="submit" id="createButton">Create</button>
        </div> 
        <p id="createMessage" role="status" aria-live="polite"></p>

        </form>
    </main>
  
    <br><br><br><br><br><br><br><br><br><br><br><br>
    <br><br><br><br><br><br><br><br><br><br><br><br>

    <!-- Footer section displaying the copyright notice -->
    <footer>
      <hr>
        &copy; copyright reserved
      <br>
    </footer>

    <!-- Loads the JavaScript file that handles form functionality -->
    <script src="CreateRecord.js"></script>

</body>
</html>
