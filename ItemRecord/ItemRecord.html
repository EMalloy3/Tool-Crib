<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Record - Tool Crib</title>
  <link rel="stylesheet" href="ItemRecord.css">
  <script src="ItemRecord.js" defer></script>
</head>
<body>

<header>
  <h1 class="company">Tool Crib</h1>
  <h1 class="title">Item Record</h1>

  <nav class="navbar">
    <ul>
      <li><a href="MainMenu.html">Main Menu</a></li>
      <li><a href="ReturnItems.html">Return Items</a></li>
      <li><a href="CreateRecord.html">Create Record</a></li>
      <li><a href="Search.html">Search</a></li>
    </ul>
  </nav>
</header>

<main>
  <section>
    <h2>Find a Tool</h2>

    <form id="searchForm">
      <label for="searchInput">Tool ID or description</label>
      <input
        type="search"
        id="searchInput"
        placeholder="Enter ID, description, serial number..."
        required
      >
      <button type="submit">Search</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <div id="searchResults"></div>
  </section>

  <hr>

  <section>
    <h2>Tool Information</h2>

    <form id="toolForm">
      <div class="sectionOne">
        <label for="toolId">Tool ID</label>
        <input id="toolId" readonly>

        <label for="description">Description</label>
        <input id="description" readonly>
      </div>

      <div class="sectionTwo">
        <label for="serialNumber">Serial Number</label>
        <input id="serialNumber" readonly>

        <label for="modelNumber">Model Number</label>
        <input id="modelNumber" readonly>
      </div>

      <div class="sectionThree">
        <label for="manufacturer">Manufacturer</label>
        <input id="manufacturer" readonly>

        <label for="type">Item Type</label>
        <input id="type" readonly>
      </div>

      <div class="sectionFour">
        <label for="calibrationDate">Calibration Completed</label>
        <input id="calibrationDate" readonly>

        <label for="calibrationDue">Calibration Due</label>
        <input id="calibrationDue" readonly>
      </div>

      <div class="sectionFive">
        <label for="location">Location</label>
        <input id="location" readonly>
      </div>

      <button type="button" id="editButton" disabled>
        Edit Location
      </button>

      <button type="submit" id="saveButton" hidden>
        Save Changes
      </button>

      <button type="button" id="cancelButton" hidden>
        Cancel
      </button>
    </form>
  </section>

  <hr>

  <section>
    <h2>Item History</h2>

    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>History ID</th>
            <th>Tool ID</th>
            <th>Employee ID</th>
            <th>Employee Name</th>
            <th>Event</th>
            <th>Event Date</th>
            <th>Checked Out</th>
            <th>Returned</th>
          </tr>
        </thead>
        <tbody id="historyBody">
          <tr>
            <td colspan="8">Search for a tool to view its history.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<footer>
  <hr>
  &copy; Copyright reserved
</footer>

</body>
</html>
