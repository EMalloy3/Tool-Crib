<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Links the external CSS file for styling -->
  <link rel="stylesheet" href="ForgotPassword.css">
  <title>Password Reset</title>
</head>

<body>

  <!-- Header section containing the company name and page title -->
  <header>
    <h1 class="company">Tool Crib</h1> <h1 class="container" style="font-size:30px">Password Recovery</h1>
  </header>

  <!-- Main section containing the password recovery form -->
  <Main>

    <!-- Form used to collect information for password recovery -->
    <form id="resetForm">

    <!-- Container for all password reset input fields -->
      <div class="reset-password">  
    <div class="container">
      <label for="employeeId">Employee ID</label>
      <input type="text" id="employeeId" name ="employeeId" required>
    </div>
  <br>

    <div class="container">
      <label for="name">Name</label>
      <input type="text" id="name" name ="name" required>
    </div>
  <br>

    <div class="container">
      <label for="email">Email Address</label>
      <input type="text" id="email" name ="email" required>
    </div>
  <br>

    <div class="container">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" name="newPassword" required >
      </div>
      <br><br>

    <!-- Button that submits the password reset form -->
      <div class="container">
        <button type="submit">Reset Password</button>
      </div>

      <!-- Displays status messages, such as success or error feedback -->
      <p id="message" role="status" aria-live="polite"></p>

    </form>

  </Main>

  <br><br><br><br><br><br><br><br><br><br><br><br>
  <br><br><br><br><br><br><br><br><br><br><br><br>

  <!-- Footer section containing the copyright notice -->
  <footer>
    <hr>
    &copy; copyright reserved
    <br>
  </footer>

    <!-- Links the JavaScript file that handles form functionality -->
    <script src="ForgotPassword.js"></script>
  
</body>
</html>
